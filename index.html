<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conference Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ivory:#F6F3EC;
    --card:#FFFFFF;
    --ink:#1F2933;
    --ink-soft:#4B5563;
    --muted:#8A8577;
    --line:#E4DFD3;
    --brass:#9C7A3C;
    --brass-deep:#6E5527;
    --brass-tint:#F1E7D2;
    --navy:#22314A;
    --navy-deep:#16202F;
    --sage:#5C7A63;
    --sage-tint:#E4EBE2;
    --danger:#B3492F;
    --danger-tint:#F5E5DF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:40px 24px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;}
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    color:var(--ink);
  }
  .sub{font-size:13px;color:var(--muted);margin-top:4px;}

  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
  }
  .add-btn{
    background:var(--navy);
    color:var(--ivory);
    font-size:13px;
    font-weight:500;
    padding:10px 18px;
    border-radius:6px;
    transition:background .15s ease;
  }
  .add-btn:hover{background:var(--navy-deep);}

  /* Spotlight */
  .spotlight{
    background:var(--navy);
    border-radius:10px;
    padding:28px 30px;
    display:flex;
    gap:28px;
    align-items:center;
    margin-bottom:36px;
  }
  .spotlight .datebox{
    text-align:center;
    min-width:88px;
    border-right:1px solid rgba(255,255,255,0.15);
    padding-right:28px;
  }
  .spotlight .month{
    font-size:13px;
    letter-spacing:0.04em;
    color:#B9C2D4;
    text-transform:uppercase;
  }
  .spotlight .day{
    font-family:'Source Serif 4',serif;
    font-size:44px;
    font-weight:600;
    color:#fff;
    line-height:1.05;
  }
  .spotlight .year{font-size:13px;color:#B9C2D4;}
  .spotlight .content{flex:1;min-width:0;}
  .spotlight .eyebrow{font-size:12px;color:#9FB0C9;margin-bottom:6px;}
  .spotlight .name{
    font-family:'Source Serif 4',serif;
    font-size:22px;
    color:#fff;
    margin:0 0 10px;
    line-height:1.3;
  }
  .conf-link{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.35);
  }
  .conf-link:hover{border-bottom-color:rgba(255,255,255,0.8);}
  .row .name .conf-link{
    color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .row .name .conf-link:hover{border-bottom-color:var(--brass);}
  .spotlight .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    font-size:13px;
    color:#DCE2ED;
  }
  .spotlight .meta-row span{display:flex;align-items:center;gap:6px;}
  .spotlight .submission-pill{
    display:inline-block;
    margin-top:14px;
    background:rgba(255,255,255,0.1);
    color:#fff;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:5px;
  }
  .spotlight .submission-pill.urgent{
    background:var(--danger-tint);
    color:var(--danger);
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .section-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 12px 2px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 6px;
    border-bottom:1px solid var(--line);
  }
  .row:first-child{border-top:1px solid var(--line);}
  .row .datebadge{
    min-width:52px;
    text-align:center;
  }
  .row .datebadge .m{font-size:11px;color:var(--muted);text-transform:uppercase;}
  .row .datebadge .d{font-family:'Source Serif 4',serif;font-size:22px;font-weight:600;color:var(--ink);}

  .row .main{flex:1;min-width:0;}
  .row .name{font-size:14.5px;font-weight:500;color:var(--ink);margin:0 0 4px;}
  .row .details{font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:14px;}
  .row .details span{display:flex;align-items:center;gap:5px;}

  .tag{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    background:var(--sage-tint);
    color:var(--sage);
    white-space:nowrap;
    cursor:default;
  }
  .tag.tag-purple{
    background:#EDE4F5;
    color:#6B3FA0;
  }

  .status-pill{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    background:var(--brass-tint);
    color:var(--brass-deep);
    white-space:nowrap;
    display:inline-block;
  }
  .status-pill.status-green{
    background:#E1F0E4;
    color:#2F7A3D;
  }

  .row .actions{display:flex;gap:4px;opacity:0;transition:opacity .1s;}
  .row:hover .actions, .row:focus-within .actions{opacity:1;}
  .icon-btn{
    background:none;
    color:var(--muted);
    font-size:12px;
    padding:6px 8px;
    border-radius:4px;
  }
  .icon-btn:hover{background:var(--line);color:var(--ink);}
  .icon-btn:focus-visible{
    opacity:1;
    outline:2px solid var(--brass);
    outline-offset:2px;
    background:var(--line);
    color:var(--ink);
  }

  .deadline-flag{
    font-size:12px;
    color:var(--danger);
  }

  /* Form */
  .form-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:32px;
  }
  .form-panel h2{
    font-family:'Source Serif 4',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 16px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .field input, .field textarea{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#FCFBF8;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--brass);
  }
  .field textarea{resize:vertical;min-height:56px;font-family:'Inter',sans-serif;}
  .error{font-size:12px;color:var(--danger);}

  .form-actions{display:flex;gap:10px;margin-top:4px;}
  .save-btn{
    background:var(--brass);
    color:#fff;
    font-size:13px;
    font-weight:500;
    padding:9px 18px;
    border-radius:6px;
  }
  .save-btn:hover{background:var(--brass-deep);}
  .cancel-btn{
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    padding:9px 14px;
  }
  .cancel-btn:hover{color:var(--ink);}

  @media (max-width:560px){
    .spotlight{flex-direction:column;align-items:flex-start;}
    .spotlight .datebox{border-right:none;padding-right:0;}
    .grid2{grid-template-columns:1fr;}
    .row{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>Conference tracker</h1>

  <div class="form-panel" id="formPanel" style="display:none;"></div>

  <div id="spotlightArea"></div>

  <div id="listArea"></div>

</div>

function parseDate(s){ return s ? new Date(s+'T00:00:00') : null; }
function fmt(d){ if(!d) return ''; return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function daysUntil(d){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t)/86400000); }
function uid(){ return 'c' + Date.now() + Math.floor(Math.random()*1000); }

async function loadConferences(){
  try{
    const raw = localStorage.getItem('conferences');
    conferences = raw ? JSON.parse(raw) : null;
  }catch(e){
    conferences = null;
  }
  if(conferences === null){
    conferences = SEED_DATA;
    await saveConferences();
  }
  render();
}

async function saveConferences(){
  try{
    localStorage.setItem('conferences', JSON.stringify(conferences));
  }catch(e){
    console.error('Storage error', e);
  }
}

function sortedUpcoming(){
  const today = new Date(); today.setHours(0,0,0,0);
  return conferences
    .filter(c => { const d = parseDate(c.startDate); return d && d >= today; })
    .sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
}

function render(){
  const upcoming = sortedUpcoming();
  const sub = document.getElementById('subline');
  sub.textContent = upcoming.length
    ? upcoming.length + ' upcoming conference' + (upcoming.length===1?'':'s')
    : 'No upcoming conferences yet';

  const spotlightArea = document.getElementById('spotlightArea');
  const listArea = document.getElementById('listArea');

  if(upcoming.length === 0){
    spotlightArea.innerHTML = '';
    listArea.innerHTML = '<div class="empty">Add your first conference to see it spotlighted here.</div>';
    return;
  }

  const [featured, ...rest] = upcoming;
  spotlightArea.innerHTML = renderSpotlight(featured);
  bindRowActions(spotlightArea, featured.id);

  if(rest.length){
    listArea.innerHTML =
      '<div class="section-label">Also on the calendar</div>' +
      rest.map(renderRow).join('');
    rest.forEach(c => bindRowActions(listArea, c.id));
  } else {
    listArea.innerHTML = '';
  }
}

function submissionInfo(c){
  const sd = parseDate(c.submissionDate);
  if(!sd) return '';
  const days = daysUntil(sd);
  let label;
  if(days < 0) label = 'Submission closed &middot; ' + fmt(sd);
  else if(days === 0) label = 'Submission due today';
  else label = 'Submission due ' + fmt(sd) + ' (' + days + ' day' + (days===1?'':'s') + ')';
  const urgent = days >= 0 && days <= 90;
  return { label, urgent };
}

function renderSpotlight(c){
  const d = parseDate(c.startDate);
  const sub = submissionInfo(c);
  return '<div class="spotlight">' +
    '<div class="datebox">' +
      '<div class="month">' + MONTHS[d.getMonth()] + '</div>' +
      '<div class="day">' + d.getDate() + '</div>' +
      '<div class="year">' + d.getFullYear() + '</div>' +
    '</div>' +
    '<div class="content">' +
      '<div class="eyebrow">Next up</div>' +
      '<p class="name">' + nameMarkup(c) + '</p>' +
      (c.status ? '<div style="margin-bottom:10px;">' + statusMarkup(c) + '</div>' : '') +
      '<div class="meta-row">' +
        (c.location ? '<span>' + escapeHtml(c.location) + '</span>' : '') +
        (c.audience ? '<span title="' + escapeHtml(c.audienceFull||c.audience) + '"' + (isPurpleAudience(c.audience) ? ' style="color:#C9A6EE;font-weight:500;"' : '') + '>' + escapeHtml(c.audience) + '</span>' : '') +
      '</div>' +
      (sub ? '<div class="submission-pill' + (sub.urgent ? ' urgent' : '') + '">' + sub.label + '</div>' : '') +
      (c.submissionDetails ? '<div style="margin-top:10px;font-size:12.5px;color:#C7CFDD;">' + escapeHtml(c.submissionDetails) + '</div>' : '') +
    '</div>' +
    '<div class="actions" style="opacity:1;">' +
      '<button class="icon-btn" style="color:#DCE2ED;" data-edit="' + c.id + '" aria-label="Edit ' + escapeHtml(c.name) + '">Edit</button>' +
      '<button class="icon-btn" style="color:#DCE2ED;" data-delete="' + c.id + '" aria-label="Remove ' + escapeHtml(c.name) + '">Remove</button>' +
    '</div>' +
  '</div>';
}

function renderRow(c){
  const d = parseDate(c.startDate);
  const sub = submissionInfo(c);
  return '<div class="row">' +
    '<div class="datebadge">' +
      '<div class="m">' + MONTHS[d.getMonth()] + '</div>' +
      '<div class="d">' + d.getDate() + '</div>' +
    '</div>' +
    '<div class="main">' +
      '<p class="name">' + nameMarkup(c) + '</p>' +
      (c.status ? '<div style="margin-bottom:6px;">' + statusMarkup(c) + '</div>' : '') +
      '<div class="details">' +
        (c.location ? '<span>' + escapeHtml(c.location) + '</span>' : '') +
        (sub ? '<span class="' + (sub.urgent ? 'deadline-flag' : '') + '">' + sub.label + '</span>' : '') +
      '</div>' +
    '</div>' +
    (c.audience ? '<span class="tag' + (isPurpleAudience(c.audience) ? ' tag-purple' : '') + '" title="' + escapeHtml(c.audienceFull||c.audience) + '">' + escapeHtml(c.audience) + '</span>' : '') +
    '<div class="actions">' +
      '<button class="icon-btn" data-edit="' + c.id + '" aria-label="Edit ' + escapeHtml(c.name) + '">Edit</button>' +
      '<button class="icon-btn" data-delete="' + c.id + '" aria-label="Remove ' + escapeHtml(c.name) + '">Remove</button>' +
    '</div>' +
  '</div>';
}

function bindRowActions(container, id){
  const editBtn = container.querySelector('[data-edit="' + id + '"]');
  const delBtn = container.querySelector('[data-delete="' + id + '"]');
  if(editBtn) editBtn.onclick = () => openForm(id);
  if(delBtn) delBtn.onclick = async () => {
    conferences = conferences.filter(c => c.id !== id);
    await saveConferences();
    render();
  };
}

const PURPLE_AUDIENCES = new Set([
  'hospital operations leaders',
  'clinical leaders',
  'geriatric leaders',
  'nurse leaders, executives',
  'researchers, clinical leaders'
]);
function isPurpleAudience(audience){
  return audience && PURPLE_AUDIENCES.has(audience.trim().toLowerCase());
}

function statusMarkup(c, extraStyle){
  if(!c.status) return '';
  const isAccepted = /accepted/i.test(c.status);
  const cls = 'status-pill' + (isAccepted ? ' status-green' : '');
  const style = extraStyle ? ' style="' + extraStyle + '"' : '';
  return '<span class="' + cls + '"' + style + '>' + escapeHtml(c.status) + '</span>';
}

function nameMarkup(c){
  if(c.link){
    return '<a class="conf-link" href="' + escapeHtml(c.link) + '" target="_blank" rel="noopener">' + escapeHtml(c.name) + '</a>';
  }
  return escapeHtml(c.name);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function openForm(id){
  editingId = id || null;
  const existing = id ? conferences.find(c => c.id === id) : null;
  const panel = document.getElementById('formPanel');
  panel.style.display = 'block';
  panel.innerHTML =
    '<h2>' + (existing ? 'Edit conference' : 'Add conference') + '</h2>' +
    '<div class="field"><label for="f-name">Conference name</label><input id="f-name" value="' + (existing ? escapeHtml(existing.name) : '') + '" placeholder="Health Equity Summit"></div>' +
    '<div class="grid2">' +
      '<div class="field"><label for="f-start">Conference date</label><input type="date" id="f-start" value="' + (existing ? existing.startDate : '') + '"></div>' +
      '<div class="field"><label for="f-location">Location</label><input id="f-location" value="' + (existing ? escapeHtml(existing.location||'') : '') + '" placeholder="Chicago, IL"></div>' +
    '</div>' +
    '<div class="field"><label for="f-link">Conference link</label><input id="f-link" value="' + (existing ? escapeHtml(existing.link||'') : '') + '" placeholder="https://example.org/conference"></div>' +
    '<div class="grid2">' +
      '<div class="field"><label for="f-subdate">Submission deadline</label><input type="date" id="f-subdate" value="' + (existing ? (existing.submissionDate||'') : '') + '"></div>' +
      '<div class="field"><label for="f-audience">Audience</label><input id="f-audience" value="' + (existing ? escapeHtml(existing.audience||'') : '') + '" placeholder="Board, funders"></div>' +
    '</div>' +
    '<div class="field"><label for="f-subdetails">Submission details</label><textarea id="f-subdetails" placeholder="Abstract, 300 words, via portal">' + (existing ? escapeHtml(existing.submissionDetails||'') : '') + '</textarea></div>' +
    '<div class="field"><label for="f-status">Status</label><input id="f-status" value="' + (existing ? escapeHtml(existing.status||'') : '') + '" placeholder="Submitted \u2013 Accepted"></div>' +
    '<div class="error" id="f-error" style="display:none;" role="alert" aria-live="assertive"></div>' +
    '<div class="form-actions">' +
      '<button class="save-btn" id="f-save">' + (existing ? 'Save changes' : 'Add conference') + '</button>' +
      '<button class="cancel-btn" id="f-cancel">Cancel</button>' +
    '</div>';

  document.getElementById('f-cancel').onclick = closeForm;
  document.getElementById('f-save').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    const startDate = document.getElementById('f-start').value;
    const errEl = document.getElementById('f-error');
    if(!name || !startDate){
      errEl.textContent = 'Enter a conference name and date.';
      errEl.style.display = 'block';
      return;
    }
    const record = Object.assign({}, existing || {}, {
      id: existing ? existing.id : uid(),
      name,
      startDate,
      location: document.getElementById('f-location').value.trim(),
      link: document.getElementById('f-link').value.trim(),
      submissionDate: document.getElementById('f-subdate').value,
      submissionDetails: document.getElementById('f-subdetails').value.trim(),
      audience: document.getElementById('f-audience').value.trim(),
      audienceFull: document.getElementById('f-audience').value.trim(),
      status: document.getElementById('f-status').value.trim()
    });
    if(existing){
      conferences = conferences.map(c => c.id === existing.id ? record : c);
    } else {
      conferences.push(record);
    }
    await saveConferences();
    closeForm();
    render();
  };
}

function closeForm(){
  editingId = null;
  const panel = document.getElementById('formPanel');
  panel.style.display = 'none';
  panel.innerHTML = '';
}

document.getElementById('addToggle').onclick = () => {
  const panel = document.getElementById('formPanel');
  if(panel.style.display === 'block' && !editingId){ closeForm(); }
  else openForm(null);
};

loadConferences();
</script>
